# Apache configuration for LATTE web application.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # PHP runtime configuration tweaks for large research datasets.
    <IfModule mod_php.c>
        php_value upload_max_filesize 64M
        php_value post_max_size 64M
        php_value memory_limit 512M
        php_value max_execution_time 300
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/latte_error.log
    CustomLog ${APACHE_LOG_DIR}/latte_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    <IfModule mod_php.c>
        php_value upload_max_filesize 64M
        php_value post_max_size 64M
        php_value memory_limit 512M
        php_value max_execution_time 300
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/latte_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/latte_ssl_access.log combined
</VirtualHost>
</IfModule>
